[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclearmc-verifier"
version = "0.1.0"
description = "Deterministic Static Conservation Guardrail & Formal Verification Engine for Monte Carlo Transport Codes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "NuclearMC-Verifier Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
mc-verifier = "guardrail.cli:main"
mc-v = "guardrail.companion:main"

[project.urls]
Homepage = "https://github.com/SHARK20031010/NuclearMC-Verifier"
Repository = "https://github.com/SHARK20031010/NuclearMC-Verifier.git"
"Bug Tracker" = "https://github.com/SHARK20031010/NuclearMC-Verifier/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardrail*", "src*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
